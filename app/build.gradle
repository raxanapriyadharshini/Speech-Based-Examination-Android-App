plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.android.logindemo'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.android.logindemo"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0-local"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // AndroidX UI
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Local, encrypted storage (EncryptedSharedPreferences + Android Keystore master key).
    // Replaces all cloud (Firebase) storage — the app is fully offline.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
