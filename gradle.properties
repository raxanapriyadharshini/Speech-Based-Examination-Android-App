# Project-wide Gradle settings.
# For more details visit https://docs.gradle.org/current/userguide/build_environment.html

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX (required for modern AGP and androidx.* dependencies).
android.useAndroidX=true

# Automatically convert third-party libraries that still use the old
# support libraries to use AndroidX.
android.enableJetifier=true

# Kotlin/Java style incremental improvements.
org.gradle.parallel=true
